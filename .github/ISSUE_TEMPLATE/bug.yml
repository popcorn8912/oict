name: Bug
description: The reference implementation or conformance suite does something wrong.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      render: shell
  - type: input
    id: env
    attributes:
      label: Node version / OS
