name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit + conformance tests
        run: npm test
      - name: Conformance report
        run: node conformance/cli.ts --spawn --compact --json conformance-report.json
      - name: Anomaly-injection benchmark
        run: npm run bench -- --out bench-results
      - uses: actions/upload-artifact@v4
        with:
          name: reports-node-${{ matrix.node }}
          path: |
            conformance-report.json
            bench-results/

  postgres:
    name: postgres · multi-instance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OICT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Three instances, one database
        run: npm run test:cluster
      - name: Conformance suite on PostgreSQL
        run: |
          export OICT_DATABASE_URL="$OICT_TEST_DATABASE_URL" OICT_SIGNING_KEY="$(openssl rand -hex 32)" OICT_TEST_HOOKS=1 PORT=8787
          node src/server/main.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/healthz >/dev/null && break; sleep 1; done
          node conformance/cli.ts --target http://localhost:8787 --compact --json conformance-postgres.json
      - name: Cluster load benchmark
        run: npm run bench:cluster -- --out cluster-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-reports
          path: |
            conformance-postgres.json
            cluster-results/
            server.log

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server + conformance in containers
        run: docker compose up --build --abort-on-container-exit --exit-code-from conformance
