<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">OICT — Open Immersive Commerce Transaction Framework</title>
  <desc id="d">A holographic product floats above a pedestal while its interaction-state hash updates; OICT binds what the shopper saw to what gets ordered.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1640"/>
      <stop offset="1" stop-color="#110E26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B490FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#B490FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE7DF">
        <animate attributeName="stop-color" values="#5EE7DF;#B490FF;#FF8BD1;#5EE7DF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#FF8BD1">
        <animate attributeName="stop-color" values="#FF8BD1;#5EE7DF;#B490FF;#FF8BD1" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="holoSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B490FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#5EE7DF" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B490FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#B490FF" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2B2560" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="24"/></clipPath>
    <style>
      .float { animation: float 6s ease-in-out infinite; transform-origin: 960px 190px; }
      .spin  { animation: dash 6s linear infinite; }
      .spinr { animation: dash 9s linear infinite reverse; }
      .scan  { animation: scan 4s ease-in-out infinite; }
      .h1 { animation: cycle 9s infinite; }
      .h2 { animation: cycle 9s infinite 3s; opacity: 0; }
      .h3 { animation: cycle 9s infinite 6s; opacity: 0; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      @keyframes dash  { to { stroke-dashoffset: -360 } }
      @keyframes scan  { 0%,100% { transform: translateY(0); opacity: 0 } 15% { opacity: .9 } 50% { transform: translateY(150px); opacity: .9 } 65% { opacity: 0 } }
      @keyframes cycle { 0% { opacity: 0 } 4%,30% { opacity: 1 } 34%,100% { opacity: 0 } }
      @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) {
        .float, .spin, .spinr, .scan, .blink { animation: none }
        .h1 { animation: none; opacity: 1 } .h2, .h3 { animation: none; opacity: 0 }
      }
      text { font-family: "Unbounded", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)" opacity=".55"/>
    <ellipse cx="960" cy="210" rx="330" ry="230" fill="url(#glow)"/>

    <!-- copy -->
    <text x="72" y="150" fill="#ECE9FF" font-size="92" font-weight="800" letter-spacing="2">OICT</text>
    <text x="76" y="196" fill="#C9C3F2" font-size="21" font-weight="500">Open Immersive Commerce Transaction Framework</text>
    <text x="76" y="252" fill="#8F89BD" font-size="17" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">What the shopper saw is what gets ordered —</text>
    <text x="76" y="278" fill="#8F89BD" font-size="17" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">in games, 3D worlds, AR/VR and AI shopping agents.</text>

    <!-- live state readout -->
    <g transform="translate(76 318)">
      <rect width="500" height="58" rx="12" fill="#1F1A48" stroke="#3A3277"/>
      <circle cx="22" cy="29" r="5" fill="#7CF2B0" class="blink"/>
      <g class="mono" font-size="14">
        <g class="h1"><text x="40" y="25" fill="#ECE9FF">stateVersion 3 · violet-m · $42.00</text><text x="40" y="45" fill="#8F89BD" class="mono">sha256:6c7d…b14e  bound ✓</text></g>
        <g class="h2"><text x="40" y="25" fill="#ECE9FF">stateVersion 4 · teal-m · $39.00</text><text x="40" y="45" fill="#8F89BD" class="mono">sha256:bb57…32f8  re-confirm</text></g>
        <g class="h3"><text x="40" y="25" fill="#FF6B8A">price changed · STALE_CONFIRMATION</text><text x="40" y="45" fill="#8F89BD" class="mono">order blocked before it exists</text></g>
      </g>
    </g>

    <!-- pedestal + orbits -->
    <ellipse cx="960" cy="300" rx="150" ry="34" fill="none" stroke="#3A3277" stroke-width="2"/>
    <ellipse class="spin" cx="960" cy="300" rx="190" ry="44" fill="none" stroke="#5EE7DF" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 14"/>
    <ellipse class="spinr" cx="960" cy="300" rx="226" ry="52" fill="none" stroke="#FF8BD1" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="2 22"/>
    <path d="M840 300 L900 140 L1020 140 L1080 300 Z" fill="url(#beam)" opacity=".6"/>
    <ellipse cx="960" cy="300" rx="120" ry="26" fill="#241E55" stroke="#B490FF" stroke-opacity=".6"/>

    <!-- holographic product: isometric box -->
    <g class="float">
      <path d="M960 86 L1040 130 L960 174 L880 130 Z" fill="url(#holo)" opacity=".95"/>
      <path d="M880 130 L960 174 L960 262 L880 218 Z" fill="url(#holoSide)" opacity=".75"/>
      <path d="M1040 130 L960 174 L960 262 L1040 218 Z" fill="url(#holo)" opacity=".5"/>
      <path d="M960 86 L1040 130 L1040 218 L960 262 L880 218 L880 130 Z" fill="none" stroke="#ECE9FF" stroke-opacity=".8" stroke-width="1.5"/>
      <path d="M960 174 L960 262 M880 130 L960 174 L1040 130" fill="none" stroke="#ECE9FF" stroke-opacity=".6" stroke-width="1.2"/>
      <g class="scan"><rect x="872" y="100" width="176" height="2" rx="1" fill="#ECE9FF" opacity=".8"/></g>
    </g>

    <!-- bound tag -->
    <g transform="translate(1086 104)">
      <path d="M-30 30 L0 6" stroke="#8F89BD" stroke-width="1"/>
      <rect width="122" height="30" rx="15" fill="#1F1A48" stroke="#3A3277"/>
      <text x="61" y="20" fill="#C9C3F2" font-size="12" text-anchor="middle" class="mono">obj-rack-03</text>
    </g>
  </g>
</svg>
