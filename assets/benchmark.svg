<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 544" width="1000" height="544" role="img" aria-labelledby="t d">
  <title id="t">Anomaly-injection benchmark</title>
  <desc id="d">Share of injected anomalies blocked, per type, over 5000 synthetic flows (seed 42). OICT blocks 100.0% with 0.0% false positives; a naive checkout-only baseline blocks 11.4%.</desc>
  <defs><linearGradient id="holo" x1="0" x2="1"><stop offset="0" stop-color="#5EE7DF"/><stop offset=".5" stop-color="#B490FF"/><stop offset="1" stop-color="#FF8BD1"/></linearGradient></defs>
  <style>
    text { font-family: "Instrument Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 14px; }
    .h { font-family: "Unbounded", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
    .g { transform-box: fill-box; transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @media (prefers-reduced-motion: reduce) { .g { animation: none } }
  </style>
  <rect width="1000" height="544" rx="20" fill="#16122E" stroke="#3A3277"/>
  <text x="32" y="46" class="h" fill="#ECE9FF" font-size="20">100.0% of injected anomalies blocked</text>
  <text x="32" y="70" fill="#8F89BD">5,000 synthetic flows · seed 42 · 0.0% false positives on legitimate purchases</text>
  <g transform="translate(700 40)"><rect width="22" height="10" rx="5" fill="url(#holo)"/><text x="30" y="10" fill="#C9C3F2" font-size="13">OICT</text><rect x="84" y="2" width="22" height="6" rx="3" fill="#6F69A0"/><text x="114" y="10" fill="#C9C3F2" font-size="13">naive baseline (11.4%)</text></g>
    <text x="314" y="113" text-anchor="end" fill="#C9C3F2">Retry with regenerated key</text>
  <rect x="330" y="98" width="560" height="12" rx="6" fill="#241E55"/>
