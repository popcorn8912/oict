  <text x="904" y="429" fill="#ECE9FF" font-size="13">100%</text><text x="904" y="442" fill="#6F69A0" font-size="12">0%</text>
  <text x="32" y="484" fill="#6F69A0" font-size="12">Reproduce with npm run bench. Baseline: a checkout-only integration that validates the bearer grant and nothing else.</text>
  <text x="32" y="502" fill="#6F69A0" font-size="12">Results describe this repository's simulator, not production data.</text>
</svg>
