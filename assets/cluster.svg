<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">OICT running as three instances on one PostgreSQL database</title>
  <desc id="d">Shoppers send every order as a retry storm to random instances. Duplicates are refused by the database. Result: 600 intended purchases, 600 orders stored, 0 duplicates.</desc>
