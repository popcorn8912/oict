services:
  oict:
    build: .
    ports: ["8787:8787"]
    environment:
      OICT_TEST_HOOKS: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 5s
      retries: 5
  conformance:
    build: .
    depends_on:
      oict: { condition: service_healthy }
    command: ["node", "conformance/cli.ts", "--target", "http://oict:8787"]
